name: Deploy intake

# What this does:
#   On every push that touches intake/ (or this workflow file), build the
#   intake app, ensure the Cloudflare Pages project exists, push the prod
#   HMAC secret, run any pending D1 migrations against the remote database,
#   and deploy. Pushes to main go to production; everything else is a
#   preview deploy at <branch>.aeolistings-intake.pages.dev.
#
# Required repo configuration (one-time):
#   Variables (Settings → Secrets and variables → Actions → Variables tab)
#     CLOUDFLARE_ACCOUNT_ID   = f700964246b5d61966399989f1910a56
#   Secrets   (Settings → Secrets and variables → Actions → Secrets tab)
#     CLOUDFLARE_API_TOKEN    = scoped per docs/specs/client-intake-v1.0.md §13
#     INTAKE_HMAC_SIGNING_KEY = `openssl rand -hex 32` (DIFFERENT from local
#                               .dev.vars; mirror to 1Password vault)

on:
  push:
    branches: ['**']
    paths:
      - 'intake/**'
      - '.github/workflows/intake-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Opt actions in to Node 24 per the same convention used in
# draft-review-cron.yml. Node 20 deprecation lands 2026-06-02.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intake
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Account + zone IDs are non-sensitive (they appear in URLs and in
      # the committed spec §13). Hardcoded here so the workflow doesn't
      # silently degrade when the optional `vars.CLOUDFLARE_*` is missing
      # or misplaced under Secrets instead of Variables.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f700964246b5d61966399989f1910a56' }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || '0c19359079073ed4a0624d55eff48501' }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: intake/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply D1 migrations (remote)
        # `migrations apply` only runs *pending* migrations, so re-running
        # on every deploy is a no-op after the first.
        if: github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply intake-db --remote --config ./wrangler.jsonc

      - name: Deploy Worker (Static Assets)
        # Production-only — Workers Static Assets doesn't have per-branch
        # previews the way Pages did. Preview branches still get tests +
        # build coverage above; the deploy step is skipped. (Re-add a
        # name-suffixed staging worker later if previews matter.)
        if: github.ref == 'refs/heads/main'
        id: deploy
        run: npx wrangler deploy --config ./wrangler.jsonc

      - name: Push HMAC signing key as a Worker secret
        # Workers Static Assets reads bindings + vars from wrangler.jsonc
        # directly. Secrets are the one thing that can't live in the
        # file — set them after the worker exists. Idempotent: every
        # deploy overwrites with the current value.
        if: github.ref == 'refs/heads/main'
        run: |
          printf '%s' "${{ secrets.INTAKE_HMAC_SIGNING_KEY }}" \
            | npx wrangler secret put HMAC_SIGNING_KEY --config ./wrangler.jsonc

      - name: Ensure Worker Route aeolistings.ai/intake/* → intake
        # Carves the /intake/* prefix out of the marketing zone and sends
        # it to the intake Worker. Worker Routes have higher precedence
        # than the marketing site's Workers Custom Domain on aeolistings.ai
        # (which acts as a hostname/*. wildcard), so this only affects
        # /intake/* — marketing is untouched. Only set on main so preview
        # branches don't fight over the route.
        #
        # Required token scope: Zone → Workers Routes → Edit on
        # aeolistings.ai. If missing, this step warns and exits zero so
        # the rest of the deploy still ships — assumes the route was
        # provisioned out-of-band (one-time manual setup with a scoped
        # token; see intake/README.md → Deploy → "One-time setup").
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PATTERN: 'aeolistings.ai/intake/*'
          SCRIPT: intake
        run: |
          list_response=$(curl -sS -w '\n%{http_code}' \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          list_code=$(printf '%s' "$list_response" | tail -n 1)
          list_body=$(printf '%s' "$list_response" | sed '$d')
          if [ "$list_code" = "403" ] || [ "$list_code" = "401" ]; then
            echo "::warning::Cloudflare returned HTTP ${list_code} listing Worker Routes for zone aeolistings.ai. The CLOUDFLARE_API_TOKEN secret is missing 'Zone → Workers Routes → Edit'. Skipping route management — assuming the route is set up out-of-band (see intake/README.md → Deploy)."
            printf '%s\n' "$list_body" | jq '{success, errors}' || true
            exit 0
          fi
          if [ "$list_code" != "200" ]; then
            echo "::error::Unexpected HTTP $list_code listing Worker Routes"
            printf '%s\n' "$list_body"
            exit 1
          fi
          existing=$(printf '%s' "$list_body" | jq -r --arg p "$PATTERN" '.result[]? | select(.pattern == $p) | .id')
          if [ -z "$existing" ]; then
            echo "Creating Worker Route $PATTERN → $SCRIPT"
            curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"pattern\":\"${PATTERN}\",\"script\":\"${SCRIPT}\"}" \
              | jq '{success, errors, "result.id": .result.id, "result.pattern": .result.pattern, "result.script": .result.script}'
          else
            echo "Worker Route exists ($existing) — updating target script to $SCRIPT"
            curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes/${existing}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"pattern\":\"${PATTERN}\",\"script\":\"${SCRIPT}\"}" \
              | jq '{success, errors, "result.pattern": .result.pattern, "result.script": .result.script}'
          fi

      - name: Smoke-test /intake/api/health
        # Sprint 1 only requires the bindings + HMAC. Other secrets
        # (Notion / Slack / 1Password / Resend) come online in Sprint 5,
        # so the endpoint legitimately reports "degraded" until then.
        # Pass when the four Sprint-1 checks are green on EITHER URL:
        #   1. intake.<acct>.workers.dev/intake/api/health — confirms the
        #      Worker itself is healthy (no zone routing involved).
        #   2. aeolistings.ai/intake/api/health — confirms the Worker
        #      Route is also wired. Optional on first deploy: the route
        #      gets swapped to point at 'intake' separately if the deploy
        #      token can't manage it.
        if: github.ref == 'refs/heads/main'
        run: |
          DIRECT="https://intake.beacho1830.workers.dev/intake/api/health"
          ROUTED="https://aeolistings.ai/intake/api/health"
          green() {
            printf '%s' "$1" | jq -e '.checks.db and .checks.kv and .checks.r2 and .checks.hmac_key_present' >/dev/null 2>&1
          }
          for i in 1 2 3 4 5 6; do
            body=$(curl -sS "$DIRECT" 2>/dev/null)
            if [ -n "$body" ] && green "$body"; then
              echo "✓ Worker healthy at $DIRECT"
              echo "$body"
              # Also try the routed URL — informational only.
              routed_body=$(curl -sS "$ROUTED" 2>/dev/null)
              if [ -n "$routed_body" ] && green "$routed_body"; then
                echo "✓ Worker Route working — $ROUTED is also live"
              else
                echo "::warning::Worker is healthy but Worker Route at $ROUTED is not (yet) returning the intake JSON. Update route → script 'intake' if first deploy; see README → Deploy."
              fi
              exit 0
            fi
            sleep 5
          done
          echo "::error::Direct Worker URL never satisfied Sprint-1 binding requirements after retries."
          exit 1
